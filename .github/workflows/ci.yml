name: WiseFox Backend CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        env:
          DATABASE_USER_NAME: ${{ secrets.DATABASE_USER_NAME }}
          DATABASE_USER_PASSWORD: ${{ secrets.DATABASE_USER_PASSWORD }}
          SECURITY_USER_NAME: ${{ secrets.SECURITY_USER_NAME }}
          SECURITY_USER_PASSWORD: ${{ secrets.SECURITY_USER_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          chmod +x mvnw
          ./mvnw verify --no-transfer-progress
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check for compilation warnings
        run: |
          chmod +x mvnw
          ./mvnw compile -Dmaven.compiler.showWarnings=true --no-transfer-progress -DskipTests
