spring.application.name=Finance
# Database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql: true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.datasource.url=${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER_NAME}	
spring.datasource.password=${DATABASE_USER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Security
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}
server.error.include-message=always
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
